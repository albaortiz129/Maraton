name: maraton-oracle

services:
  maraton:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    pids_limit: 100
    environment:
      MARATON_DATA_DIR: /var/lib/maraton
      MARATON_HTTPS: "1"
      MARATON_TRUST_PROXY: "1"
      MARATON_ALLOW_REGISTRATION: "1"
      MARATON_PUBLIC_URL: https://${MARATON_DOMAIN:?Define MARATON_DOMAIN in .env.oracle}
      MARATON_SMTP_HOST: ${MARATON_SMTP_HOST:-}
      MARATON_SMTP_PORT: ${MARATON_SMTP_PORT:-465}
      MARATON_SMTP_USER: ${MARATON_SMTP_USER:-}
      MARATON_SMTP_PASSWORD: ${MARATON_SMTP_PASSWORD:-}
      MARATON_SMTP_FROM: ${MARATON_SMTP_FROM:-}
      MARATON_SECRET_KEY: ${MARATON_SECRET_KEY:?Define MARATON_SECRET_KEY in .env.oracle}
    volumes:
      - ./data:/var/lib/maraton:Z
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/apache2:size=8m,mode=755
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 160m
    pids_limit: 100
    depends_on:
      maraton:
        condition: service_healthy
    environment:
      MARATON_DOMAIN: ${MARATON_DOMAIN:?Define MARATON_DOMAIN in .env.oracle}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - private

networks:
  private:

volumes:
  caddy_data:
  caddy_config:
