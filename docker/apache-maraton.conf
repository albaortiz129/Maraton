ServerTokens Prod
ServerSignature Off
ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(?:sqlite|db|key|env|ini|log)$">
        Require all denied
    </FilesMatch>

    <LocationMatch "^/(?:data|docker)(?:/|$)">
        Require all denied
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://image.tmdb.org data:; connect-src 'self' https://api.themoviedb.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
